type: object
description: Paginated list of public payment methods.
required:
  - data
  - total
  - page
  - count
properties:
  data:
    type: array
    description: Payment methods on the current page.
    items:
      $ref: ./PaymentMethod.yaml
  total:
    type: integer
    minimum: 0
    description: Total number of matching payment methods.
    example: 15
  page:
    type: integer
    minimum: 1
    description: Current page number (`p` query parameter).
    example: 1
  count:
    type: integer
    minimum: 1
    description: Page size (`c` query parameter).
    example: 10
