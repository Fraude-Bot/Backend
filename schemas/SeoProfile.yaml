type: object
description: One active scammer or organization in the public SEO index.
required:
  - id
  - type
  - updatedAt
properties:
  id:
    type: integer
    minimum: 1
    description: Scammer or organization ID.
    example: 1
  type:
    type: string
    description: Profile kind.
    enum:
      - scammer
      - organization
    example: scammer
  updatedAt:
    type: string
    format: date-time
    description: Last update in UTC, with no fractional seconds.
    example: "2026-08-24T00:00:00Z"
