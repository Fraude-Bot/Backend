type: object
description: An organization linked to a scammer. Public reads return active records only.
required:
  - id
  - name
  - created_at
properties:
  id:
    type: integer
    minimum: 1
    description: Numeric organization ID.
    example: 1
  name:
    type: string
    description: Display name.
    example: Jane Doe
  created_at:
    type: string
    format: date
    description: Date the organization was created (`YYYY-MM-DD`).
    example: "2026-08-24"
