description: A reported organization. Public reads return active records only.
type: object
required:
  - id
  - name
  - reports
  - profile_picture
  - products
  - status
  - created_at
properties:
  id:
    type: integer
    minimum: 1
    description: Numeric entity ID.
    example: 1
  name:
    type: string
    description: Display name.
    example: Jane Doe
  reports:
    type: integer
    minimum: 0
    description: Number of active reports.
    example: 4
  profile_picture:
    type:
      - string
      - "null"
    description: Stored public-disk path of the profile picture, or null when none is set.
    example: reports/organizations/profiles/8f3c1a.jpg
  products:
    type: array
    description: Distinct product categories from active reports.
    items:
      type: string
      enum:
        - Crypto
        - Scamming
        - Money Laundering
        - Billing
        - Banking
        - Insurance
        - Real Estate
        - Legal
        - Other
    example:
      - Crypto
      - Banking
  status:
    type: boolean
    description: Whether the entity is active. Public reads return active records only.
    example: true
  created_at:
    type: string
    format: date
    description: Date the entity was created (`YYYY-MM-DD`).
    example: "2026-08-24"
