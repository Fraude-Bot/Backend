openapi: "3.1.0"
info:
  title: Fraudebot API
  version: 1.0.0
  description: |
    Public JSON API for fraud-intelligence profiles.

    Only active scammers, organizations, contacts, and reports are returned.
    Scammer and organization name suggestions also include inactive and soft-deleted names.
    Public routes are rate-limited to 120 requests per minute per IP.

    Pagination uses `p` (page, 1–100000, default 1) and `c` (page size, 1–100, default 10).
    Contact `platform` query values are lowercase enum names (`whatsapp`);
    responses return the formatted label (`Whatsapp`).

    Dates use `YYYY-MM-DD`. Report search and administrative endpoints are not included.
servers:
  - url: /api
tags:
  - name: Scammers
    description: Public scammer profiles, contacts, reports, report calendars, and name suggestions.
  - name: Organizations
    description: Public organization profiles, contacts, reports, report calendars, and name suggestions.
  - name: Reports
    description: Public report uploads.
  - name: Health
    description: Liveness and readiness checks.
  - name: Documentation
    description: The public OpenAPI contract.
paths:
  /public/scammers/suggest:
    get:
      tags: [Scammers]
      operationId: suggestScammerNames
      summary: Suggest scammer names
      description: |
        Returns up to 5 distinct scammer names that contain `q`, ordered by name.
        Inactive and soft-deleted scammers are included.
        A missing `q`, a value shorter than 2 characters, or a value longer than 100
        characters returns an empty array.
      parameters:
        - name: q
          in: query
          required: false
          description: Substring to match against the scammer name. Shorter than 2 characters, missing, or longer than 100 yields an empty array.
          schema:
            type: string
            maxLength: 100
          example: Acme
      responses:
        "200":
          description: Matching scammer names.
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  type: string
              example:
                - Acme Payments
                - Acme Retail
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/scammers/{id}:
    get:
      tags: [Scammers]
      operationId: getScammer
      summary: Get a scammer by ID
      description: Returns the public profile of an active scammer.
      parameters:
        - $ref: "#/components/parameters/ScammerId"
      responses:
        "200":
          description: Public scammer profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scammer"
        "400":
          description: The scammer ID is not a valid integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid scammer ID
        "404":
          description: No active scammer exists for this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Scammer not found
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/scammers/{id}/contacts:
    get:
      tags: [Scammers]
      operationId: listScammerContacts
      summary: List scammer contacts
      description: Returns a paginated list of active contacts for an active scammer.
      parameters:
        - $ref: "#/components/parameters/ScammerId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Count"
        - $ref: "#/components/parameters/Platform"
      responses:
        "200":
          description: Paginated scammer contacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedContacts"
        "400":
          description: The scammer ID, page, or count is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid scammer ID, page or count
        "404":
          description: The scammer does not exist or is inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Scammer contacts not found
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/scammers/{id}/reports:
    get:
      tags: [Scammers]
      operationId: listScammerReports
      summary: List scammer reports
      description: Returns a paginated list of active report cards for an active scammer.
      parameters:
        - $ref: "#/components/parameters/ScammerId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Count"
      responses:
        "200":
          description: Paginated scammer report cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedReports"
        "400":
          description: The scammer ID, page, or count is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid scammer ID, page or count
        "404":
          description: The scammer does not exist or is inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Scammer reports not found
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/scammers/{id}/calendar/{year}:
    get:
      tags: [Scammers]
      operationId: getScammerCalendar
      summary: Get a scammer report calendar
      description: Returns monthly active-report counts for a scammer in the given year.
      parameters:
        - $ref: "#/components/parameters/ScammerId"
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: Monthly report counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReportCalendar"
        "400":
          description: The scammer ID or year is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid scammer ID or year
        "404":
          description: The scammer does not exist or is inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Scammer calendar not found
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/organizations/suggest:
    get:
      tags: [Organizations]
      operationId: suggestOrganizationNames
      summary: Suggest organization names
      description: |
        Returns up to 5 distinct organization names that contain `q`, ordered by name.
        Inactive and soft-deleted organizations are included.
        A missing `q`, a value shorter than 2 characters, or a value longer than 100
        characters returns an empty array.
      parameters:
        - name: q
          in: query
          required: false
          description: Substring to match against the organization name. Shorter than 2 characters, missing, or longer than 100 yields an empty array.
          schema:
            type: string
            maxLength: 100
          example: Acme
      responses:
        "200":
          description: Matching organization names.
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  type: string
              example:
                - Acme Payments
                - Acme Retail
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/organizations/{id}:
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Get an organization by ID
      description: Returns the public profile of an active organization.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Public organization profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: The organization ID is not a valid integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid organization ID
        "404":
          description: No active organization exists for this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Organization not found
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/organizations/{id}/contacts:
    get:
      tags: [Organizations]
      operationId: listOrganizationContacts
      summary: List organization contacts
      description: Returns a paginated list of active contacts for an active organization.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Count"
        - $ref: "#/components/parameters/Platform"
      responses:
        "200":
          description: Paginated organization contacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedContacts"
        "400":
          description: The organization ID, page, or count is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid organization ID, page or count
        "404":
          description: The organization does not exist or is inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Organization contacts not found
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/organizations/{id}/reports:
    get:
      tags: [Organizations]
      operationId: listOrganizationReports
      summary: List organization reports
      description: Returns a paginated list of active report cards for an active organization.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Count"
      responses:
        "200":
          description: Paginated organization report cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedReports"
        "400":
          description: The organization ID, page, or count is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid organization ID, page or count
        "404":
          description: The organization does not exist or is inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Organization reports not found
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/organizations/{id}/calendar/{year}:
    get:
      tags: [Organizations]
      operationId: getOrganizationCalendar
      summary: Get an organization report calendar
      description: Returns monthly active-report counts for an organization in the given year.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: Monthly report counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReportCalendar"
        "400":
          description: The organization ID or year is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid organization ID or year
        "404":
          description: The organization does not exist or is inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Organization not found
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/reports/media/profiles:
    post:
      tags: [Reports]
      operationId: storeTemporaryProfilePicture
      summary: Upload a temporary profile picture
      description: |
        Accepts a JPG or PNG image up to 5 MB. The original is stored on the raw
        disk and must pass image moderation before a 640×640 cover is published on
        the public disk under `tmp/reports/profiles`. The response path is
        the public URL of that file. Uploading the same image again returns the
        existing URL while the file is still present. A rejected image is moved
        to quarantine and the response does not include its path; it responds
        with 422 and error code `image_rejected`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPG or PNG image, 5 MB maximum.
      responses:
        "201":
          description: The image was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredImagePath"
              example:
                path: http://localhost:9000/storage/tmp/reports/profiles/8f3c1a.jpg
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/reports/media/proofs:
    post:
      tags: [Reports]
      operationId: storeTemporaryProof
      summary: Upload temporary proof images
      description: |
        Accepts one or more JPG or PNG images, up to 5 MB each. Each original is
        stored on the raw disk and must pass image moderation before it is published
        at its original size on the public disk under `tmp/reports/proofs`.
        Each response path is the public URL of that file. Uploading the same image
        again returns the existing URL while that file is still present. A rejected
        image is moved to quarantine and the response does not include its path;
        it responds with 422 and error code `image_rejected`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: binary
                  description: JPG or PNG images, 5 MB maximum each.
      responses:
        "201":
          description: The images were stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredImagePaths"
              example:
                paths:
                  - http://localhost:9000/storage/tmp/reports/proofs/8f3c1a.jpg
                  - http://localhost:9000/storage/tmp/reports/proofs/9a4d2b.png
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/reports/organizations:
    post:
      tags: [Reports]
      operationId: storeOrganizationReport
      summary: Create a report for a new organization
      description: |
        Creates a report and a new organization, then attaches the submitted
        contacts, payment methods, and products. A contact that already exists for the same
        platform and reference is reused, and a payment method that already exists
        for the same type and reference is reused. A trashed match is restored.
        A product whose name already exists is reused, including a difference in letter case.
        The stored spelling is kept.
        Every field is required except `proofs`.
        `profile_picture` and `proofs` are public-disk paths previously returned by
        the temporary media endpoints, such as `/storage/tmp/reports/profiles/file.jpg`,
        and the files must still be present.
        The report is stored without a user and is active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationReportRequest"
            example:
              title: Fake store took my money
              description: They never shipped the order.
              profile_picture: /storage/tmp/reports/profiles/8f3c1a.jpg
              proofs:
                - /storage/tmp/reports/proofs/8f3c1a.jpg
                - /storage/tmp/reports/proofs/9a4d2b.png
              organization:
                name: Tienda Falsa
              contacts:
                - platform: whatsapp
                  reference: "+525511112222"
              payment_methods:
                - type: clabe
                  reference: "012345678901234567"
              products:
                - Crypto
                - Banking
      responses:
        "201":
          description: The report and organization were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationReportCreated"
              example:
                id: 1
                organization_id: 2
                contact_ids: [3]
                payment_method_ids: [5]
                product_ids: [8, 9]
                report_proof_ids: [6, 7]
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/reports/scammers:
    post:
      tags: [Reports]
      operationId: storeScammerReport
      summary: Create a report for a new scammer
      description: |
        Creates a report and a new scammer, then attaches the submitted
        contacts, payment methods, and products. A contact that already exists for the same
        platform and reference is reused, and a payment method that already exists
        for the same type and reference is reused. A trashed match is restored.
        A product whose name already exists is reused, including a difference in letter case.
        The stored spelling is kept.
        Every field is required except `proofs`.
        `profile_picture` and `proofs` are public-disk paths previously returned by
        the temporary media endpoints, such as `/storage/tmp/reports/profiles/file.jpg`,
        and the files must still be present.
        The report is stored without a user and is active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScammerReportRequest"
            example:
              title: Called me about a prize
              description: They asked for a transfer to release the prize.
              profile_picture: /storage/tmp/reports/profiles/8f3c1a.jpg
              proofs:
                - /storage/tmp/reports/proofs/8f3c1a.jpg
                - /storage/tmp/reports/proofs/9a4d2b.png
              scammer:
                name: Juan Perez
              contacts:
                - platform: whatsapp
                  reference: "+525511112222"
              payment_methods:
                - type: clabe
                  reference: "012345678901234567"
              products:
                - Crypto
                - Banking
      responses:
        "201":
          description: The report and scammer were created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScammerReportCreated"
              example:
                id: 1
                scammer_id: 2
                contact_ids: [3]
                payment_method_ids: [5]
                product_ids: [8, 9]
                report_proof_ids: [6, 7]
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/healthcheck:
    get:
      tags: [Health]
      operationId: getHealthcheck
      summary: Liveness check
      description: Returns ok when the application process is up.
      responses:
        "200":
          description: The application is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/readiness:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness check
      description: Probes the database and cache. Returns ready when both succeed.
      responses:
        "200":
          description: Dependency checks completed.
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status:
                    type: string
                    enum: [ready, degraded]
                    example: ready
                  checks:
                    type: object
                    required: [database, cache]
                    properties:
                      database:
                        type: string
                        example: ok
                      cache:
                        type: string
                        example: ok
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: The database or cache probe failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"
  /public/openapi:
    get:
      tags: [Documentation]
      operationId: getOpenApiDocument
      summary: OpenAPI document
      description: Returns the public API contract with schema file references resolved.
      responses:
        "200":
          description: Bundled OpenAPI document.
          content:
            application/json:
              schema:
                type: object
                required: [openapi, info, paths]
                properties:
                  openapi:
                    type: string
                    example: "3.1.0"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  parameters:
    ScammerId:
      name: id
      in: path
      required: true
      description: Numeric ID of the scammer.
      schema:
        type: integer
        minimum: 1
      example: 1
    OrganizationId:
      name: id
      in: path
      required: true
      description: Numeric ID of the organization.
      schema:
        type: integer
        minimum: 1
      example: 1
    Year:
      name: year
      in: path
      required: true
      description: Calendar year. Must be between 2000 and next year, inclusive.
      schema:
        type: integer
        minimum: 2000
      example: 2026
    Page:
      name: p
      in: query
      required: false
      description: Page number.
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 1
      example: 1
    Count:
      name: c
      in: query
      required: false
      description: Number of contacts per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      example: 10
    Platform:
      name: platform
      in: query
      required: false
      description: Filter contacts by platform. Use the lowercase enum name.
      schema:
        type: string
        enum:
          - whatsapp
          - facebook
          - youtube
          - tiktok
          - email
          - cellphone
          - telegram
          - instagram
          - url
          - other
      example: instagram
  responses:
    ValidationFailed:
      description: The request data is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
          example:
            error:
              code: validation_failed
              message: The request data is invalid.
              details:
                image:
                  - The image field must be a file of type: jpg, jpeg, png.
    RateLimited:
      description: Too many requests. Public routes allow 120 requests per minute per IP.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
          example:
            error:
              code: rate_limited
              message: Too Many Attempts.
  schemas:
    StoredImagePath:
      type: object
      required: [path]
      properties:
        path:
          type: string
          format: uri
          description: Public URL of the stored image.
          example: http://localhost:9000/storage/tmp/reports/profiles/8f3c1a.jpg
    StoredImagePaths:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
          description: Public URLs of the stored images, in request order.
          example:
            - http://localhost:9000/storage/tmp/reports/proofs/8f3c1a.jpg
            - http://localhost:9000/storage/tmp/reports/proofs/9a4d2b.png
    CreateOrganizationReportRequest:
      type: object
      required: [title, description, profile_picture, organization, contacts, payment_methods, products]
      properties:
        title:
          type: string
          maxLength: 50
          example: Fake store took my money
        description:
          type: string
          example: They never shipped the order.
        profile_picture:
          type:
            - string
            - "null"
          description: Public-disk path of a file under `tmp/reports/profiles`.
          example: /storage/tmp/reports/profiles/8f3c1a.jpg
        proofs:
          type: array
          items:
            type: string
            description: Public-disk path of a file under `tmp/reports/proofs`.
            example: /storage/tmp/reports/proofs/8f3c1a.jpg
        organization:
          type: object
          required: [name]
          properties:
            name:
              type: string
              maxLength: 100
              example: Tienda Falsa
        contacts:
          type: array
          minItems: 1
          items:
            type: object
            required: [platform, reference]
            properties:
              platform:
                oneOf:
                  - type: integer
                    minimum: 1
                    maximum: 10
                  - type: string
                    enum:
                      - whatsapp
                      - facebook
                      - youtube
                      - tiktok
                      - email
                      - cellphone
                      - telegram
                      - instagram
                      - url
                      - other
              reference:
                type: string
                maxLength: 255
        payment_methods:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, reference]
            properties:
              type:
                oneOf:
                  - type: integer
                    minimum: 1
                    maximum: 5
                  - type: string
                    enum: [card_number, clabe, account_number, wallet, other]
              reference:
                type: string
                maxLength: 255
        products:
          type: array
          minItems: 1
          items:
            type: string
            maxLength: 75
            example: Crypto
          description: Product names to create or reuse and attach to the report.
        scammers:
          type: array
          description: Optional scammers to create or reuse by name and link to the organization. Contacts and payment methods belong to the scammer.
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                maxLength: 100
                example: Juan Perez
              contacts:
                type: array
                items:
                  type: object
                  required: [platform, reference]
                  properties:
                    platform:
                      oneOf:
                        - type: integer
                          minimum: 1
                          maximum: 10
                        - type: string
                          enum:
                            - whatsapp
                            - facebook
                            - youtube
                            - tiktok
                            - email
                            - cellphone
                            - telegram
                            - instagram
                            - url
                            - other
                    reference:
                      type: string
                      maxLength: 255
              payment_methods:
                type: array
                items:
                  type: object
                  required: [type, reference]
                  properties:
                    type:
                      oneOf:
                        - type: integer
                          minimum: 1
                          maximum: 5
                        - type: string
                          enum: [card_number, clabe, account_number, wallet, other]
                    reference:
                      type: string
                      maxLength: 255
    OrganizationReportCreated:
