openapi: "3.1.0"
info:
  title: Fraudebot API
  version: 1.0.0
  description: |
    Public JSON API for fraud-intelligence profiles.

    Only active scammers, organizations, contacts, and reports are returned.
    Public routes are rate-limited to 120 requests per minute per IP.

    Pagination uses `p` (page, 1–100000, default 1) and `c` (page size, 1–100, default 10).
    Contact `platform` query values are lowercase enum names (`whatsapp`);
    responses return the formatted label (`Whatsapp`).

    Dates use `YYYY-MM-DD`. Search and administrative endpoints are not included.
servers:
  - url: /api
tags:
  - name: Scammers
    description: Public scammer profiles, contacts, reports, and report calendars.
  - name: Organizations
    description: Public organization profiles, contacts, reports, and report calendars.
  - name: Reports
    description: Public report uploads.
  - name: Health
    description: Liveness and readiness checks.
paths:
  /public/scammers/{id}:
    get:
      tags: [Scammers]
      operationId: getScammer
      summary: Get a scammer by ID
      description: Returns the public profile of an active scammer.
      parameters:
        - $ref: "#/components/parameters/ScammerId"
      responses:
        "200":
          description: Public scammer profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scammer"
        "400":
          description: The scammer ID is not a valid integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid scammer ID
        "404":
          description: No active scammer exists for this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Scammer not found
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/scammers/{id}/contacts:
    get:
      tags: [Scammers]
      operationId: listScammerContacts
      summary: List scammer contacts
      description: Returns a paginated list of active contacts for an active scammer.
      parameters:
        - $ref: "#/components/parameters/ScammerId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Count"
        - $ref: "#/components/parameters/Platform"
      responses:
        "200":
          description: Paginated scammer contacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedContacts"
        "400":
          description: The scammer ID, page, or count is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid scammer ID, page or count
        "404":
          description: The scammer does not exist or is inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Scammer contacts not found
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/scammers/{id}/reports:
    get:
      tags: [Scammers]
      operationId: listScammerReports
      summary: List scammer reports
      description: Returns a paginated list of active report cards for an active scammer.
      parameters:
        - $ref: "#/components/parameters/ScammerId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Count"
      responses:
        "200":
          description: Paginated scammer report cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedReports"
        "400":
          description: The scammer ID, page, or count is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid scammer ID, page or count
        "404":
          description: The scammer does not exist or is inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Scammer reports not found
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/scammers/{id}/calendar/{year}:
    get:
      tags: [Scammers]
      operationId: getScammerCalendar
      summary: Get a scammer report calendar
      description: Returns monthly active-report counts for a scammer in the given year.
      parameters:
        - $ref: "#/components/parameters/ScammerId"
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: Monthly report counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReportCalendar"
        "400":
          description: The scammer ID or year is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid scammer ID or year
        "404":
          description: The scammer does not exist or is inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Scammer calendar not found
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/organizations/{id}:
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Get an organization by ID
      description: Returns the public profile of an active organization.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      responses:
        "200":
          description: Public organization profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          description: The organization ID is not a valid integer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid organization ID
        "404":
          description: No active organization exists for this ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Organization not found
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/organizations/{id}/contacts:
    get:
      tags: [Organizations]
      operationId: listOrganizationContacts
      summary: List organization contacts
      description: Returns a paginated list of active contacts for an active organization.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Count"
        - $ref: "#/components/parameters/Platform"
      responses:
        "200":
          description: Paginated organization contacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedContacts"
        "400":
          description: The organization ID, page, or count is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid organization ID, page or count
        "404":
          description: The organization does not exist or is inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Organization contacts not found
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/organizations/{id}/reports:
    get:
      tags: [Organizations]
      operationId: listOrganizationReports
      summary: List organization reports
      description: Returns a paginated list of active report cards for an active organization.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Count"
      responses:
        "200":
          description: Paginated organization report cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedReports"
        "400":
          description: The organization ID, page, or count is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid organization ID, page or count
        "404":
          description: The organization does not exist or is inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Organization reports not found
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/organizations/{id}/calendar/{year}:
    get:
      tags: [Organizations]
      operationId: getOrganizationCalendar
      summary: Get an organization report calendar
      description: Returns monthly active-report counts for an organization in the given year.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/Year"
      responses:
        "200":
          description: Monthly report counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReportCalendar"
        "400":
          description: The organization ID or year is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Invalid organization ID or year
        "404":
          description: The organization does not exist or is inactive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorMessage"
              example:
                message: Organization not found
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/reports/pictures/profiles:
    post:
      tags: [Reports]
      operationId: storeTemporaryProfilePicture
      summary: Upload a temporary profile picture
      description: |
        Accepts a JPG or PNG image up to 5 MB, covers it to 640×640, and stores it
        on the public disk under `tmp/pictures/reports/profile`. The response path
        is the public URL of that file. Uploading the same image again returns the
        existing URL while the file is still present.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPG or PNG image, 5 MB maximum.
      responses:
        "201":
          description: The image was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredImagePath"
              example:
                path: http://localhost:9000/storage/tmp/pictures/reports/profile/8f3c1a.jpg
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/reports/proofs:
    post:
      tags: [Reports]
      operationId: storeTemporaryProof
      summary: Upload temporary proof images
      description: |
        Accepts one or more JPG or PNG images, up to 5 MB each, and stores them at
        their original size on the public disk under `tmp/pictures/reports/proofs`.
        Each response path is the public URL of that file. Uploading the same image
        again returns the existing URL while that file is still present.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: binary
                  description: JPG or PNG images, 5 MB maximum each.
      responses:
        "201":
          description: The images were stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredImagePaths"
              example:
                paths:
                  - http://localhost:9000/storage/tmp/pictures/reports/proofs/8f3c1a.jpg
                  - http://localhost:9000/storage/tmp/pictures/reports/proofs/9a4d2b.png
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/healthcheck:
    get:
      tags: [Health]
      operationId: getHealthcheck
      summary: Liveness check
      description: Returns ok when the application process is up.
      responses:
        "200":
          description: The application is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: ok
        "429":
          $ref: "#/components/responses/RateLimited"
  /public/readiness:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness check
      description: Probes the database and cache. Returns ready when both succeed.
      responses:
        "200":
          description: Dependency checks completed.
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status:
                    type: string
                    enum: [ready, degraded]
                    example: ready
                  checks:
                    type: object
                    required: [database, cache]
                    properties:
                      database:
                        type: string
                        example: ok
                      cache:
                        type: string
                        example: ok
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: The database or cache probe failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpError"
components:
  parameters:
    ScammerId:
      name: id
      in: path
      required: true
      description: Numeric ID of the scammer.
      schema:
        type: integer
        minimum: 1
      example: 1
    OrganizationId:
      name: id
      in: path
      required: true
      description: Numeric ID of the organization.
      schema:
        type: integer
        minimum: 1
      example: 1
    Year:
      name: year
      in: path
      required: true
      description: Calendar year. Must be between 2000 and next year, inclusive.
      schema:
        type: integer
        minimum: 2000
      example: 2026
    Page:
      name: p
      in: query
      required: false
      description: Page number.
      schema:
        type: integer
        minimum: 1
        maximum: 100000
        default: 1
      example: 1
    Count:
      name: c
      in: query
      required: false
      description: Number of contacts per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      example: 10
    Platform:
      name: platform
      in: query
      required: false
      description: Filter contacts by platform. Use the lowercase enum name.
      schema:
        type: string
        enum:
          - whatsapp
          - facebook
          - youtube
          - tiktok
          - email
          - cellphone
          - telegram
          - instagram
          - url
          - other
      example: instagram
  responses:
    ValidationFailed:
      description: The request data is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
          example:
            error:
              code: validation_failed
              message: The request data is invalid.
              details:
                image:
                  - The image field must be a file of type: jpg, jpeg, png.
    RateLimited:
      description: Too many requests. Public routes allow 120 requests per minute per IP.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HttpError"
          example:
            error:
              code: rate_limited
              message: Too Many Attempts.
  schemas:
    StoredImagePath:
      type: object
      required: [path]
      properties:
        path:
          type: string
          format: uri
          description: Public URL of the stored image.
          example: http://localhost:9000/storage/tmp/pictures/reports/profile/8f3c1a.jpg
    StoredImagePaths:
      type: object
      required: [paths]
      properties:
        paths:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
          description: Public URLs of the stored images, in request order.
          example:
            - http://localhost:9000/storage/tmp/pictures/reports/proofs/8f3c1a.jpg
            - http://localhost:9000/storage/tmp/pictures/reports/proofs/9a4d2b.png
    ErrorMessage:
      $ref: ./schemas/ErrorMessage.yaml
    HttpError:
      $ref: ./schemas/HttpError.yaml
    Contact:
      $ref: ./schemas/Contact.yaml
    PaginatedContacts:
      $ref: ./schemas/PaginatedContacts.yaml
    Report:
      $ref: ./schemas/Report.yaml
    PaginatedReports:
      $ref: ./schemas/PaginatedReports.yaml
    MonthlyReportCalendar:
      $ref: ./schemas/MonthlyReportCalendar.yaml
    ReportedEntity:
      $ref: ./schemas/ReportedEntity.yaml
    Scammer:
      $ref: ./schemas/Scammer.yaml
    Organization:
      $ref: ./schemas/Organization.yaml
