    CreateScammerReportRequest:
      type: object
      required: [title, description, profile_picture, scammer, contacts, payment_methods, products]
      properties:
        title:
          type: string
          maxLength: 50
          example: Called me about a prize
        description:
          type: string
          example: They asked for a transfer to release the prize.
        profile_picture:
          type:
            - string
            - "null"
          description: Public-disk path of a file under `tmp/reports/profile`.
          example: /storage/tmp/reports/profile/8f3c1a.jpg
        proofs:
          type: array
          items:
            type: string
            description: Public-disk path of a file under `tmp/reports/proofs`.
            example: /storage/tmp/reports/proofs/8f3c1a.jpg
        scammer:
          type: object
          required: [name]
          properties:
            name:
              type: string
              maxLength: 100
              example: Juan Perez
        contacts:
          type: array
          minItems: 1
          items:
            type: object
            required: [platform, reference]
            properties:
              platform:
                oneOf:
                  - type: integer
                    minimum: 1
                    maximum: 10
                  - type: string
                    enum:
                      - whatsapp
                      - facebook
                      - youtube
                      - tiktok
                      - email
                      - cellphone
                      - telegram
                      - instagram
                      - url
                      - other
              reference:
                type: string
                maxLength: 255
        payment_methods:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, reference]
            properties:
              type:
                oneOf:
                  - type: integer
                    minimum: 1
                    maximum: 5
                  - type: string
                    enum: [card_number, clabe, account_number, wallet, other]
              reference:
                type: string
                maxLength: 255
        products:
          type: array
          minItems: 1
          items:
            type: string
            maxLength: 75
            example: Crypto
          description: Product names to create or reuse and attach to the report.
        organizations:
          type: array
          description: Optional organizations to create or reuse by name and link to the scammer. Contacts and payment methods belong to the organization. The report is not filed against these organizations.
          items:
            type: object
            required: [name]
            properties:
              name:
                type: string
                maxLength: 100
                example: Tienda Falsa
              contacts:
                type: array
                items:
                  type: object
                  required: [platform, reference]
                  properties:
                    platform:
                      oneOf:
                        - type: integer
                          minimum: 1
                          maximum: 10
