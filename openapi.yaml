                            - youtube
                            - tiktok
                            - email
                            - cellphone
                            - telegram
                            - instagram
                            - url
                            - other
                    reference:
                      type: string
                      maxLength: 255
              payment_methods:
                type: array
                items:
                  type: object
                  required: [type, reference]
                  properties:
                    type:
                      oneOf:
                        - type: integer
                          minimum: 1
                          maximum: 5
                        - type: string
                          enum: [card_number, clabe, account_number, wallet, other]
                    reference:
                      type: string
                      maxLength: 255
